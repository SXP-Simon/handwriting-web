[project]
name = "handwrite-backend"
version = "1.34.0"
description = "手写体生成器后端"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "handrightbeta==8.7.0",
    "Pillow==10.0.1",
    "opencv-python<5",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "PyMuPDF==1.23.5",
    "PyPDF2==3.0.1",
    "pypandoc==1.12",
    "python-docx==0.8.11",
    "python-dotenv==1.0.0",
    "jinja2>=3.1.0",
    "sentry-sdk==1.27.1",
    "schedule==1.2.1",
    "psutil>=5.9.0",
    "Werkzeug==2.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
